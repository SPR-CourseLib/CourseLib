upstream django {
    server web:8000;
}

server {
    listen 80;

    # Збільшуємо ліміт для завантаження відео/картинок
    client_max_body_size 50M;

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Роздача статики для Django Адмінки
    location /static/ {
        alias /app/staticfiles/;
    }
}